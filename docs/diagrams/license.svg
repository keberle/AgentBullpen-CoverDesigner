<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Artistic license: four levels, from Faithful to Wild; each sets how many concepts the concept call writes and how strongly the book's style block binds; the author's request wins at every level." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs><rect width="1000" height="560" fill="#000000"/><text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">ARTISTIC LICENSE · ONE CONTROL ABOVE THE COVER · IT SETS HOW FAR A PAINT MAY MOVE</text>
<rect x="20" y="56" width="225" height="330" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="36" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="start" font-weight="700">Faithful</text>
<text x="36" y="108" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">IN THE APP</text>
<text x="36" y="126" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Paints what you ask, literally.</text>
<text x="36" y="142" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Keeps the book's style exactly.</text>
<text x="36" y="176" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">CONCEPTS WRITTEN</text>
<text x="36" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF" text-anchor="start" font-weight="700">1</text>
<text x="36" y="250" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">MAY CHANGE</text>
<text x="36" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">nothing new: no new symbol</text>
<text x="36" y="284" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">or subject</text>
<text x="36" y="318" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">BOOK'S STYLE BLOCK</text>
<text x="36" y="336" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">hard constraint, verbatim</text>
<line x1="247" y1="220" x2="263" y2="220" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="265" y="56" width="225" height="330" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="281" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="start" font-weight="700">Interpretive</text>
<text x="281" y="108" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">IN THE APP</text>
<text x="281" y="126" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Weighs a few ideas and picks</text>
<text x="281" y="142" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">the best fit.</text>
<text x="281" y="176" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">CONCEPTS WRITTEN</text>
<text x="281" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#60A5FA" text-anchor="start" font-weight="700">3</text>
<text x="281" y="250" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">MAY CHANGE</text>
<text x="281" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">composition, viewpoint, light,</text>
<text x="281" y="284" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">one visual metaphor</text>
<text x="281" y="318" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">BOOK'S STYLE BLOCK</text>
<text x="281" y="336" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">medium + palette kept</text>
<line x1="492" y1="220" x2="508" y2="220" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="510" y="56" width="225" height="330" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="526" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="start" font-weight="700">Bold</text>
<text x="526" y="108" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">IN THE APP</text>
<text x="526" y="126" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">Skips the obvious idea</text>
<text x="526" y="142" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">for a symbolic one.</text>
<text x="526" y="176" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">CONCEPTS WRITTEN</text>
<text x="526" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF" text-anchor="start" font-weight="700">6</text>
<text x="526" y="250" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">MAY CHANGE</text>
<text x="526" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">symbolic over literal, odd</text>
<text x="526" y="284" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">crop or scale; genre kept</text>
<text x="526" y="318" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">BOOK'S STYLE BLOCK</text>
<text x="526" y="336" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">medium kept; palette may shift</text>
<line x1="737" y1="220" x2="753" y2="220" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="755" y="56" width="225" height="330" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="771" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="start" font-weight="700">Wild</text>
<text x="771" y="108" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">IN THE APP</text>
<text x="771" y="126" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">A conceptual or abstract take;</text>
<text x="771" y="142" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">may drop the characters entirely.</text>
<text x="771" y="176" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">CONCEPTS WRITTEN</text>
<text x="771" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#FFFFFF" text-anchor="start" font-weight="700">10</text>
<text x="771" y="250" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">MAY CHANGE</text>
<text x="771" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">concept over depiction,</text>
<text x="771" y="284" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">any medium</text>
<text x="771" y="318" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="start" font-weight="700" letter-spacing="1.2">BOOK'S STYLE BLOCK</text>
<text x="771" y="336" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">optional inspiration</text>
<text x="20" y="424" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">AT EVERY LEVEL</text>
<text x="36" y="450" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· the author's explicit request wins over the book's style block — Faithful included</text>
<text x="36" y="470" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· the plate stays textless, front-cover framed, with quiet bands for the type</text>
<text x="36" y="490" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· at Bold and Wild the concept call discards the obvious first idea before it lists the others</text>
<text x="36" y="510" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· nothing is attributed to the book that isn't in the brief</text>
<text x="20" y="540" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">The level goes with every turn; changing it doesn't paint — the next paint uses it.</text></svg>