<text x="32" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">08</text>
<text x="32" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Author's words</text>
<line x1="146" y1="242" x2="158" y2="242" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="160" y="210" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="172" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">09</text>
<text x="172" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Typography</text>
<line x1="286" y1="242" x2="298" y2="242" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="300" y="210" width="126" height="64" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="312" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">10</text>
<text x="312" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Behind the site</text>
<line x1="426" y1="242" x2="438" y2="242" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="440" y="210" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="452" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">11</text>
<text x="452" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Failure modes</text>
<line x1="566" y1="242" x2="578" y2="242" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="580" y="210" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="592" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">12</text>
<text x="592" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Public-ready</text>
<line x1="706" y1="242" x2="718" y2="242" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="720" y="210" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="732" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">13</text>
<text x="732" y="256" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Any provider · $</text>
<path d="M923 154 L923 182 L83 182 L83 208" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<text x="20" y="350" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">THREE LESSONS</text>
<rect x="20" y="372" width="960" height="62" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="36" y="398" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">It asked instead of painting.</text>
<text x="36" y="418" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">The first designer kept asking questions. One instruction — paint in the same turn when art is asked for — fixed it.</text>
<rect x="20" y="448" width="960" height="62" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="36" y="474" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">The book's style beat the author.</text>
<text x="36" y="494" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">A seeded style block kept the hound in every plate. The author's request now outranks the style block at every level.</text>
<rect x="20" y="524" width="960" height="62" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="36" y="550" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">A small model writes one idea.</text>
<text x="36" y="570" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">Asked for variety, a small chat model gave near-identical plates. Brainstorming moved out of the agent into a concept call in code.</text>
<text x="20" y="612" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Each layer was mocked up first, then built, then run against real models before the next.</text></svg>