<text x="452" y="114" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">04</text>
<text x="452" y="136" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Versions + PNG</text>
<line x1="566" y1="122" x2="578" y2="122" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="580" y="90" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="592" y="114" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">05</text>
<text x="592" y="136" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Paint on ask</text>
<line x1="706" y1="122" x2="718" y2="122" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="720" y="90" width="126" height="64" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="732" y="114" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">06</text>
<text x="732" y="136" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">License + craft</text>
<line x1="846" y1="122" x2="858" y2="122" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="860" y="90" width="126" height="64" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="872" y="114" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#60A5FA" text-anchor="start" font-weight="700">07</text>
<text x="872" y="136" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">Concepts in code</text>
