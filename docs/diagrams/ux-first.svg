<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="UX first: the order the app was built in, from a render surface and a chat window to a demo behind the site, with the three lessons that changed the design." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs><rect width="1000" height="640" fill="#000000"/><text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">UX FIRST · A RENDER SURFACE AND A CHAT WINDOW, THEN ONE LAYER AT A TIME</text>
