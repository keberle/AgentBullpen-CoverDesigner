<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Cover craft: the precedence ladder from hard invariants down to the model's own idea, and the image prompt's labelled order, the last segment appended by code." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs><rect width="1000" height="600" fill="#000000"/><text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">COVER CRAFT · A SKILL FILE THE DESIGNER AND THE CONCEPT CALL BOTH READ</text>
<text x="20" y="64" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">PRECEDENCE</text>
<text x="118.0" y="64" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">what wins when two of them disagree</text>
<rect x="20" y="78" width="500" height="44" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="38" y="106" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#60A5FA" text-anchor="start" font-weight="700">1</text>
<text x="62" y="106" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">Hard invariants</text>
<text x="205.0" y="106" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">textless · type areas · 2:3 · policy</text>
<rect x="20" y="132" width="485" height="44" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="38" y="160" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#60A5FA" text-anchor="start" font-weight="700">2</text>
<text x="62" y="160" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">The author's request</text>
<text x="248.0" y="160" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">subject, medium, palette, mood</text>
<rect x="20" y="186" width="470" height="44" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="38" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#60A5FA" text-anchor="start" font-weight="700">3</text>
<text x="62" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">The book's style block</text>
<text x="265.2" y="214" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">bound per the license level</text>
<rect x="20" y="240" width="455" height="44" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="38" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#60A5FA" text-anchor="start" font-weight="700">4</text>
<text x="62" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">Genre codes</text>
<text x="170.6" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">80 % convention, 20 % creativity</text>
<rect x="20" y="294" width="440" height="44" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="38" y="322" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#60A5FA" text-anchor="start" font-weight="700">5</text>
<text x="62" y="322" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">The model's own idea</text>
<text x="248.0" y="322" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">only in the room 1–4 leave open</text>
<text x="540" y="64" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">THE PROMPT</text>
<text x="638.0" y="64" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">labelled segments, in this order</text>
<rect x="540" y="78" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="556" y="101" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">USE</text>
<text x="686" y="101" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">front-cover illustration plate, portrait, no lettering</text>
<rect x="540" y="122" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="556" y="145" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">SCENE / GROUND</text>
<text x="686" y="145" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">background, setting, atmosphere</text>
<rect x="540" y="166" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="556" y="189" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">SUBJECT</text>
<text x="686" y="189" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">the one emblem or figure, its scale and place</text>
<rect x="540" y="210" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="556" y="233" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">DETAILS</text>
<text x="686" y="233" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">medium and process, 2–3 colours, one light</text>
<rect x="540" y="254" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="556" y="277" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">+ FRAMING</text>
<text x="686" y="277" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">quiet top quarter and bottom sixth for the type</text>
<rect x="540" y="298" width="440" height="36" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="556" y="321" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700">+ TEXTLESS</text>
<text x="686" y="321" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">no text, lettering, logos or watermarks</text>
<text x="540" y="352" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">dashed: appended by code, last, on every paint</text>
<text x="20" y="394" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">A PLATE THAT CODE WILL LETTER</text>
<text x="36" y="420" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· one focal point, a simple ground, one light source, 2–3 colours</text>
<text x="36" y="440" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· reads at about an inch tall in a store listing: big silhouette, strong value contrast</text>
<text x="36" y="460" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· the type areas described by region, tone and emptiness — placement words are a weak spot for image models</text>
<text x="36" y="480" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· describe the physical medium (ink, paper, cloth, brush), not just a label; no polish words</text>
<text x="20" y="520" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Sources are cited inline in the skill file (api/skills/cover-craft.md): publishing guides, genre-convention studies,</text>
<text x="20" y="538" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">OpenAI's image prompting guide and two papers on creativity in generative models.</text></svg>