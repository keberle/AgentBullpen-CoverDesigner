<text x="20" y="206" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">ON SCREEN</text>
<text x="109.39999999999999" y="206" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">examples · the full table is on the page</text>
<text x="20" y="236" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">used up</text>
<text x="170" y="236" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">“You've used today's $1.00. The designer comes back at 6:00 PM.” — input off, back by itself</text>
<line x1="20" y1="248" x2="980" y2="248" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="268" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">rate-limited</text>
<text x="170" y="268" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">“One moment…” then one automatic send; a second miss: “try again in a minute”</text>
<line x1="20" y1="280" x2="980" y2="280" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="300" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">unavailable</text>
<text x="170" y="300" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">gateway: “The designer is resting …” · standalone: what to fix in your own setup</text>
<line x1="20" y1="312" x2="980" y2="312" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="332" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">paint failed</text>
<text x="170" y="332" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">the designer's answer + “The picture couldn't be painted …” + Retry paint; no version</text>
<line x1="20" y1="344" x2="980" y2="344" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="364" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">content policy</text>
<text x="170" y="364" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">“The image service declined that picture. Try describing it differently.”</text>
<line x1="20" y1="376" x2="980" y2="376" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="396" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#FFFFFF" text-anchor="start">internal</text>
<text x="170" y="396" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">“Something went wrong (ref &lt;traceId&gt;).” — the ref finds the trace in the dashboard</text>
<line x1="20" y1="408" x2="980" y2="408" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="20" y="450" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">PAID CALLS</text>
<text x="118.0" y="450" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">when a call is sent again</text>
<text x="20" y="478" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">rate limit (429)</text>
<text x="200" y="478" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">wait up to 30 s, send once more — refused before anything is generated</text>
<text x="20" y="508" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">5xx · timeout, image</text>
<text x="200" y="508" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">never: it may already be billed; the author decides with Retry paint</text>
<text x="20" y="538" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start">account failures</text>
<text x="200" y="538" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">never: credits, quota or a rejected key need a person</text>
<text x="20" y="580" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Never in a problem: the provider's own error text, a key, an endpoint or the site's provider account.</text></svg>