<text x="115.0" y="133" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">moderation refusal</text>
<rect x="250" y="52" width="250" height="52" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="375.0" y="76" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Site LLM proxy</text>
