<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Configuration: committed template settings, a gitignored appsettings.Development.json with your values, keys as Aspire secret parameters; the AppHost turns them into environment variables for the Python API." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,0.45)"/></marker></defs><rect width="1000" height="520" fill="#000000"/><text x="20" y="30" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#60A5FA" text-anchor="start" font-weight="700" letter-spacing="1.2">CONFIGURATION · SETTINGS IN A FILE YOU DON'T COMMIT · KEYS IN USER SECRETS · ENV VARS TO THE API</text>
<rect x="20" y="60" width="300" height="96" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="34" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">appsettings.json</text>
<text x="34" y="103" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">committed template</text>
<text x="34" y="118" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">Llm, Llm:Image, Gateway, Web</text>
<text x="34" y="133" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">values starting with &lt; count as unset</text>
<rect x="20" y="176" width="300" height="96" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="34" y="200" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">appsettings.Development.json</text>
<text x="34" y="219" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">gitignored · your values</text>
<text x="34" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">copy the Llm block and fill it in</text>
<rect x="20" y="292" width="300" height="96" rx="8" fill="#0A0A0A" stroke="#60A5FA" stroke-width="1.2"/>
<text x="34" y="316" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">aspire secret set</text>
<text x="34" y="335" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">Parameters:llm-api-key</text>
<text x="34" y="350" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">Parameters:image-api-key</text>
<text x="34" y="365" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">→ your user-secrets, not the repo</text>
<rect x="380" y="176" width="220" height="96" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="490.0" y="200" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">AppHost</text>
<text x="490.0" y="219" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">reads all three</text>
<text x="490.0" y="234" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">adds a key only when set</text>
<text x="490.0" y="249" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">starts api + web</text>
<line x1="320" y1="108" x2="378" y2="200" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="320" y1="224" x2="378" y2="224" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="320" y1="340" x2="378" y2="248" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="660" y="60" width="320" height="330" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
<text x="674" y="84" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="700">Environment → api</text>
<text x="676" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">LLM_TYPE  LLM_MODEL  LLM_ENDPOINT</text>
<text x="676" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">LLM_API_KEY (secret)</text>
<text x="676" y="144" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">LLM_TIMEOUT_SECONDS</text>
<text x="676" y="164" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">LLM_CONCEPT_MODEL</text>
<text x="676" y="184" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">LLM_CONCEPT_REASONING_EFFORT</text>
<text x="676" y="204" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start"></text>
<text x="676" y="224" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">IMAGE_TYPE  IMAGE_MODEL</text>
<text x="676" y="244" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">IMAGE_ENDPOINT</text>
<text x="676" y="264" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">IMAGE_API_KEY (secret)</text>
<text x="676" y="284" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">IMAGE_SIZE  IMAGE_QUALITY</text>
<text x="676" y="304" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">IMAGE_TIMEOUT_SECONDS</text>
<text x="676" y="324" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start"></text>
<text x="676" y="344" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">GATEWAY_* · behind the site only</text>
<line x1="600" y1="224" x2="658" y2="224" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" marker-end="url(#a)"/>
<text x="20" y="432" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="700" letter-spacing="1.2">PROVIDERS</text>
<text x="36" y="458" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· chat: OpenAI, Azure OpenAI, OpenRouter (all over Chat Completions) or Anthropic · images: OpenAI or OpenRouter</text>
<text x="36" y="478" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· without a chat model the app runs and says so; without images the designer still talks</text>
<text x="36" y="498" font-family="'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="start">· in a container there is no AppHost: set the same environment variables directly</text></svg>